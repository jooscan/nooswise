# Postgres tuned for a 1 GB e2-micro shared with the Node app and Caddy.
# The defaults assume a machine several times this size and will get the database
# OOM-killed under load.

listen_addresses = '*'

# ~128 MB of shared buffers leaves room for the app; the whole dataset for a bill
# splitter fits comfortably regardless.
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 32MB
work_mem = 4MB

# The app pool caps at 5. Twenty leaves headroom for psql and pg_dump without
# reserving memory for connections that will never exist.
max_connections = 20

# Shared-core CPU: keep background work modest.
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
autovacuum_max_workers = 1

# Persistent disk is standard (HDD) on the free tier — random I/O is expensive.
random_page_cost = 4.0
effective_io_concurrency = 1

wal_level = replica
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
