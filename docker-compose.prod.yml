# Runs on the e2-micro VM. Three containers on one box: Postgres, the app, and
# cloudflared, which dials OUT to Cloudflare and tunnels traffic back in.
#
# The VM does have an ephemeral external IP — it needs one for outbound access
# (apt, docker pull, git pull, and cloudflared's own connection out). But nothing
# inbound is ever allowed to it: the firewall opens no ports except SSH scoped to
# Google's IAP relay, and no container here publishes a port. All traffic to the
# app arrives through the tunnel, which cloudflared establishes outbound-only.
#
# Because the IP is ephemeral it changes whenever the VM is stopped and started.
# That is fine precisely because of the tunnel — there is no DNS record pointing
# at the IP to go stale.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Values come from .env alongside this file (see .env.production.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Off by default in the alpine image, but be explicit: without it a restore into
      # a differently-collated cluster can silently reorder text indexes.
      LANG: C.UTF-8
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres.conf:/etc/postgresql/postgresql.conf:ro
    # No `ports:` — Postgres is reachable only from the app container on the internal
    # network. There is no external IP on this VM for it to be exposed on anyway.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nooswise:${NOOSWISE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PG_POOL_MAX: '5'
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
